{% extends "base.html" %}

{% block title %}Upload Data{% endblock %}

{% block content %}
<h3 class="mb-4">Step 1: Upload Dataset (CSV or Excel)</h3>
<form method="POST" enctype="multipart/form-data" action="{{ url_for('upload_file') }}" class="p-3 border rounded">
    <div class="mb-3">
        <label for="file" class="form-label">Select your sales data file:</label>
        <input type="file" class="form-control" id="file" name="file" accept=".csv, .xlsx, .xls" required>
        <div class="form-text">File must contain columns: **InvoiceDate, CustomerID, Quantity, UnitPrice**</div>
    </div>
    <button type="submit" class="btn btn-primary">
        Upload & Process RFM
    </button>
</form>
{% endblock %}
